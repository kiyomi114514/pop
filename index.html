<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pop</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 42%,#282063,#080b20 75%);font-family:system-ui,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;color:white;text-shadow:0 5px 30px #0008}
  h1{font-size:clamp(3rem,9vw,9rem);margin:0;letter-spacing:.08em}
  p{font-size:clamp(1rem,2.4vw,2rem);opacity:.85}
  .hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#ffffffa0;font-size:14px}
</style>
<canvas id="stage" aria-label="全屏彩纸礼炮动画"></canvas>
<div class="center"><div><h1>🎉 pop! 🎉</h1><p>送你一场满屏的庆祝</p></div></div>
<div class="hint">点击屏幕再放一炮 · 按 F11 退出全屏</div>
<script>
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
let w,h,pieces=[];const colors=['#ffcc33','#ff5f8f','#46d9ff','#9b7bff','#68ee9a','#ff8a4b','#ffffff'];
function resize(){w=canvas.width=innerWidth*devicePixelRatio;h=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight}
addEventListener('resize',resize);resize();
function boom(x=w/2,y=h*.67){for(let i=0;i<430;i++){let a=Math.random()*Math.PI*2,s=4+Math.random()*14;pieces.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,size:4+Math.random()*9,rot:Math.random()*7,spin:(Math.random()-.5)*.3,color:colors[Math.random()*colors.length|0],life:130+Math.random()*100})}}
function frame(){ctx.clearRect(0,0,w,h);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.vx*=.993;p.rot+=p.spin;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life/35);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.55);ctx.restore();if(p.life<=0||p.y>h+20)pieces.splice(i,1)}requestAnimationFrame(frame)}
addEventListener('pointerdown',e=>boom(e.clientX,e.clientY));boom(w*.27,h*.65);boom(w*.73,h*.65);setTimeout(()=>boom(),450);setInterval(()=>boom(Math.random()*w,h*.55+Math.random()*h*.25),2500);frame();
</script>
</html>
